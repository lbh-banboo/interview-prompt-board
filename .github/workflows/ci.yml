name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip   # 依赖清单为 requirements.txt，满足 cache 键要求
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Download local models (sha256 verified)
        run: python tools/fetch_models.py
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build (tsc)
        run: npm run build
      - name: Run frontend unit tests
        # e2e（*.e2e.test.mjs）依赖 macOS 音频环境与 Fake 音源设备，是本地测试职责
        # （README：npm test 在开发机跑全量），CI 只验证编译与纯逻辑单元测试。
        run: node --test $(find tests_web -name '*.test.mjs' ! -name '*.e2e.test.mjs')
